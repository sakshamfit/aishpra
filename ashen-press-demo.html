<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ashen Press Demonstration</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Cormorant Garamond', serif;
            background-color: #000;
            color: #fff;
            overflow-x: hidden;
        }
        .demo-container {
            padding: 2rem;
            text-align: center;
        }
        .demo-container h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: #8b0000;
        }
        .demo-container p {
            max-width: 600px;
            margin: 0 auto 2rem;
            line-height: 1.6;
            opacity: 0.8;
        }
        .ashen-press-wrapper {
            position: relative;
            width: 100%;
            height: 80vh;
            max-width: 1200px;
            margin: 0 auto;
        }
        .controls {
            position: absolute;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            padding: 1rem;
            border-radius: 0.5rem;
        }
        .controls button {
            background: #8b0000;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            margin: 0 0.5rem;
            border-radius: 0.25rem;
            cursor: pointer;
        }
        .controls button:hover {
            background: #6b0000;
        }
        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.001ms !important;
                transition-duration: 0.001ms !important;
            }
        }
    </style>
</head>
<body>
    <div class="demo-container">
        <h1>Ashen Press - The Art Book Shelf</h1>
        <p>A tactile 3D art-book shelf with ten clothbound volumes, embedded illustrated plates, reflective oak furniture, a torn-paper detail reveal, and direct hover, select, flip, and drag interactions.</p>

        <div class="ashen-press-wrapper" id="ashen-press-container">
            <!-- The AshenPress component will be mounted here -->
        </div>

        <div class="controls">
            <button id="reset-view">Reset View</button>
            <button id="toggle-info">Toggle Info</button>
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.181.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.181.0/examples/jsm/",
            "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.12.2/dist/gsap.js",
            "react": "https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js",
            "react-dom": "https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"
        }
    }
    </script>

    <script type="module">
        // Import our AshenPress component
        import { AshenPress } from './src/shaders/ashen-press/AshenPress.tsx';

        // Import the shared CSS
        import './src/shaders/threeui.css';

        // Create the scene component
        function Scene() {
            return (
                <div className="shader-frame">
                    <AshenPress />
                </div>
            );
        }

        // Render to the container
        const root = ReactDOM.createRoot(document.getElementById('ashen-press-container'));
        root.render(<Scene />);

        // Add simple controls
        document.getElementById('reset-view').addEventListener('click', () => {
            // Reset camera position - would need to access the instance
            alert('Reset view functionality would reset camera to initial position');
        });

        document.getElementById('toggle-info').addEventListener('click', () => {
            const infoElements = document.querySelectorAll('.demo-container h1, .demo-container p');
            infoElements.forEach(el => {
                el.style.display = el.style.display === 'none' ? 'block' : 'none';
            });
        });
    </script>
</body>
</html>
